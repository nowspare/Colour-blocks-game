<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Found — Colour Block</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .notfound { text-align: center; padding: 2rem; }
    .notfound h1 { font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -0.03em; }
    .notfound p { color: #9aa0b4; margin: 1rem 0 2rem; }
    .notfound a { display: inline-block; padding: 0.9rem 1.6rem; border-radius: 999px;
      background: linear-gradient(145deg, #60a5fa, #2563eb); color: #fff; text-decoration: none;
      font-weight: 700; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="notfound">
    <h1>404</h1>
    <p>That block doesn't fit here.</p>
    <a href="./">Back to game</a>
  </div>
</body>
</html>
